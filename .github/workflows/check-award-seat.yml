name: Check award seats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      origin:
        description: "Override origin airport (one-off run)"
        required: false
      destinations:
        description: "Override destinations, comma separated (one-off run)"
        required: false
      start_date:
        description: "Override start date YYYY-MM-DD (one-off run)"
        required: false
      end_date:
        description: "Override end date YYYY-MM-DD (one-off run)"
        required: false
      alert_mode:
        description: "Override alert mode: business, economy, both, any"
        required: false
      notify_when_empty:
        description: "Send a notification even when nothing is found"
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Remembers what was last alerted so unchanged availability doesn't
      # re-notify every 5 minutes (the "only alert on change" setting).
      - name: Restore last alert state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: award-alert-state-${{ github.run_id }}
          restore-keys: |
            award-alert-state-

      - name: Check award availability
        env:
          SEATSAERO_API_KEY: ${{ secrets.SEATSAERO_API_KEY || secrets.SEATS_AERO_API_KEY || secrets.API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # All search settings live in config/monitor-config.json (edit via the
          # dashboard in docs/). The inputs below only override a manual run.
          ORIGIN_AIRPORT: ${{ inputs.origin }}
          DESTINATION_AIRPORTS: ${{ inputs.destinations }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          ALERT_MODE: ${{ inputs.alert_mode }}
          NOTIFY_WHEN_EMPTY: ${{ inputs.notify_when_empty == true && 'true' || '' }}
        run: mkdir -p .state && node scripts/check-award-seat.mjs

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: award-alert-state-${{ github.run_id }}
