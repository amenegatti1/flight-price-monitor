name: Check award seats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        destination: [SIN, KUL, AMD, CGK]
        carrier: [QF, VA]
        include:
          - carrier: QF
            source: qantas
          - carrier: VA
            source: velocity
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check award availability (${{ matrix.carrier }} → ${{ matrix.destination }})
        env:
          SEATSAERO_API_KEY: ${{ secrets.SEATSAERO_API_KEY || secrets.SEATS_AERO_API_KEY || secrets.API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          ORIGIN_AIRPORT: ${{ vars.ORIGIN_AIRPORT || 'MEL' }}
          DESTINATION_AIRPORT: ${{ matrix.destination }}
          DEPARTURE_DATE: ${{ vars.DEPARTURE_DATE || '2026-08-21' }}
          SOURCE: ${{ matrix.source }}
          CARRIER: ${{ matrix.carrier }}
          SEAT_COUNT: ${{ vars.SEAT_COUNT || '1' }}
          CABINS: business,economy
          ALERT_CABINS: business,economy
          ONLY_DIRECT: ${{ vars.ONLY_DIRECT || 'true' }}
          USE_LIVE_SEARCH: ${{ vars.USE_LIVE_SEARCH || 'false' }}
          NOTIFY_WHEN_EMPTY: ${{ vars.NOTIFY_WHEN_EMPTY || 'false' }}
        run: node scripts/check-award-seat.mjs
